site_name: Apache Airflow .NET SDK
site_description: Strongly typed .NET SDK for the Apache Airflow public REST API, maintained by loud-technology.
site_url: https://loud-technology.github.io/loud-technology-airflow-sdk/
repo_url: https://github.com/loud-technology/loud-technology-airflow-sdk
repo_name: loud-technology/loud-technology-airflow-sdk
edit_uri: edit/main/docs/

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - Client configuration: guides/configuration.md
      - Release publishing: guides/release-publishing.md
# EXAMPLES:START
# EXAMPLES:END

theme:
  name: material
  language: en
  favicon: media/icon128.png
  logo: media/icon128.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
